name: Update NFL schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '43 12 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download NFL schedule
        run: |
          mkdir -p data
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv' \
            --output data/nfl-schedule.csv
          test $(wc -c < data/nfl-schedule.csv) -gt 10000
          head -n 1 data/nfl-schedule.csv | grep -q 'gameday'
      - name: Commit schedule when updated
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl-schedule.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL schedule'
            git pull --rebase
            git push
          fi
