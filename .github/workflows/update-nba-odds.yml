
name: Update DraftKings NBA Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download DraftKings NBA odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.parse, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          key = os.environ.get("ODDS_API_KEY")
          if not key:
              raise SystemExit("Missing ODDS_API_KEY secret")

          base = "https://api.the-odds-api.com/v4/sports/basketball_nba"
          markets = [
              "player_points",
              "player_rebounds",
              "player_assists",
              "player_threes",
          ]

          def get(path, params):
              params["apiKey"] = key
              url = base + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url, headers={"User-Agent": "SportsEdge/1.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)

          games = get("/odds", {
              "regions": "us",
              "markets": "h2h,spreads,totals",
              "bookmakers": "draftkings",
              "oddsFormat": "american"
          })

          props = []
          errors = []
          for game in games:
              for market in markets:
                  try:
                      result = get(
                          "/events/" + game["id"] + "/odds",
                          {
                              "regions": "us",
                              "markets": market,
                              "bookmakers": "draftkings",
                              "oddsFormat": "american"
                          }
                      )
                      props.append(result)
                  except Exception as exc:
                      errors.append(str(exc))

          output = {
              "bookmaker": "draftkings",
              "fetched_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "games": games,
              "player_props": props,
              "errors": errors
          }

          Path("nba-draftkings-odds.json").write_text(
              json.dumps(output, indent=2)
          )
          print(
              f"Saved {len(games)} NBA games and "
              f"{len(props)} prop-market responses"
          )
          PY

      - name: Save odds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nba-draftkings-odds.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DraftKings NBA odds'
            git push
          fi
