
name: Update NFL stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 2024, 2025 and 2026 weekly stats
        run: |
          mkdir -p data
          for year in 2024 2025 2026; do
            curl --fail --location --retry 3 --silent --show-error \
              "https://github.com/nflverse/nflverse-data/releases/download/stats_player/stats_player_week_${year}.csv" \
              --output "data/nfl-${year}.csv"

            test $(wc -c < "data/nfl-${year}.csv") -gt 10000
            head -n 1 "data/nfl-${year}.csv" | grep -q 'passing_yards'
          done

      - name: Save changes to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nfl-2024.csv data/nfl-2025.csv data/nfl-2026.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update NFL weekly stats'
            git push
          fi
