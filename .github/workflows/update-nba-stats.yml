
name: Update NBA Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'

permissions:
  contents: write

jobs:
  update-nba:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download NBA game logs
        run: python update_nba_stats.py

      - name: Save NBA statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/nba-game-logs.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update NBA player statistics'
            git push
          fi
